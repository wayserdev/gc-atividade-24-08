name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Conferir dependencia travada
        run: sha256sum --check dependencies.sha256
      - name: Compilar e executar testes com assertions
        run: bash testar.sh
      - name: Validar pacote distribuivel
        run: bash empacotar.sh dev
      - uses: actions/upload-artifact@v4
        with:
          name: uniride-dev
          path: dist/uniride-dev.zip*
          if-no-files-found: error
